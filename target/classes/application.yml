server:
  port: 8080

spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  application:
    name: ai-interview-assistant

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/ai_interview?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    openai:
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
          max-tokens: 1024

jwt:
  secret: YourJwtSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm
  expiration: 86400000

logging:
  level:
    com.aiinterview: DEBUG

app:
  upload-dir: uploads/resumes
